# 推送 v* 标签时自动打包通用版（Apple 芯片 + Intel）Drip.dmg 并发布 Release
#   git tag v1.1.0 && git push origin v1.1.0
#
# 配置了以下 Secrets 时，用 Developer ID 证书签名并提交苹果公证；没配置则退回临时签名：
#   MACOS_CERT_P12       Developer ID Application 证书（含私钥）导出的 .p12，base64 编码
#   MACOS_CERT_PASSWORD  导出 .p12 时设置的密码
#   NOTARY_KEY           App Store Connect API 密钥 AuthKey_XXXX.p8，base64 编码
#   NOTARY_KEY_ID        API 密钥 ID
#   NOTARY_ISSUER_ID     API 密钥的 Issuer ID
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
    steps:
      - uses: actions/checkout@v5

      # 建一个临时钥匙串导入证书，任务结束即删除
      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [[ -n "$SIGN_ID" ]] || { echo "::error::证书里没有 Developer ID Application 身份"; exit 1; }
          echo "SIGN_ID=$SIGN_ID" >> "$GITHUB_ENV"

      - name: Configure notarization
        if: env.MACOS_CERT_P12 != '' && env.NOTARY_KEY != ''
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials drip-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_PROFILE=drip-notary" >> "$GITHUB_ENV"

      - name: Build, sign and package
        run: |
          UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./build.sh dmg
          mv build/Drip-*.dmg "Drip-${GITHUB_REF_NAME}.dmg"

      - name: Verify
        run: |
          lipo -archs build/Drip.app/Contents/MacOS/Drip
          codesign --display --verbose=2 build/Drip.app 2>&1 | grep -E "Authority|TeamIdentifier|Runtime" || true
          if [[ -n "${NOTARY_PROFILE:-}" ]]; then
            xcrun stapler validate "Drip-${GITHUB_REF_NAME}.dmg"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Drip-${GITHUB_REF_NAME}.dmg" \
            --title "Drip ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Clean up keychain
        if: always() && env.MACOS_CERT_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
