# 推送 v* 标签时自动打包通用版（Apple 芯片 + Intel）Drip.dmg 并发布 Release
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build universal app
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Verify
        run: |
          lipo -archs build/Drip.app/Contents/MacOS/Drip
          codesign --verify --verbose build/Drip.app

      # DMG 里放 Drip.app 和一个指向 /Applications 的快捷方式，打开后拖进去即可安装
      - name: Package DMG
        run: |
          mkdir -p dmg
          cp -R build/Drip.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Drip -srcfolder dmg -ov -format UDZO "Drip-${GITHUB_REF_NAME}.dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Drip-${GITHUB_REF_NAME}.dmg" \
            --title "Drip ${GITHUB_REF_NAME}" \
            --generate-notes
