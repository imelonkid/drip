# 临时：确认 macos-26 / macos-latest 构建机的 Xcode / SDK 版本并编译打包；合并前删除
name: tmp-verify-macos15
on:
  push:
    branches: [fix/runner-macos15]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version && swift --version && xcrun --show-sdk-version
      - run: bash scripts/package-desktop.sh 0.0.0 v0.0.0 "$RUNNER_TEMP/out"
      - run: vtool -show-build "$RUNNER_TEMP/out/Drip.app/Contents/MacOS/Drip"
